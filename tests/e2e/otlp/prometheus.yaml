apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: default
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: default
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v3.9.1
        args:
          - "--config.file=/etc/prometheus/prometheus.yml"
          # Prometheus receives OTLP over HTTP only, on the web port, at
          # /api/v1/otlp/v1/metrics. The 4317/4318 ports below are declared for
          # convention; nothing listens on them. Covering --otlp-protocol=grpc
          # would need an OpenTelemetry Collector in front.
          - "--web.enable-otlp-receiver"
        ports:
        - containerPort: 9090
          name: web
        - containerPort: 4317
          name: grpc
        - containerPort: 4318
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
      volumes:
      - name: config
        configMap:
          name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: default
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  ports:
  - name: web
    port: 9090
    targetPort: 9090
  - name: grpc
    port: 4317
    targetPort: 4317
  - name: http
    port: 4318
    targetPort: 4318
